services:
  postgres:
    image: postgres:16-alpine
    container_name: dulce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dulce_colonial
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - dulce_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dulce_colonial"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend_dulce_colonial
      dockerfile: Dockerfile
    container_name: dulce_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dulce_colonial?schema=public

      CORS_ORIGIN: http://localhost

      JWT_SECRET: cambiar_este_jwt_secret_local_dulce_colonial_64_chars_minimo
      JWT_EXPIRES_IN: 8h
      JWT_REFRESH_SECRET: cambiar_este_refresh_secret_local_dulce_colonial_64_chars
      JWT_REFRESH_EXPIRES_IN: 7d

      GOOGLE_REDIRECT_URI: http://localhost/google/callback
      GOOGLE_CREDENTIALS_PATH: ./config/google-credentials.json
      GOOGLE_TOKEN_PATH: ./config/google-token.json
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_CONSOLE_AUTH: "false"
    ports:
      - "3000:3000"
    volumes:
      - dulce_reports:/app/reports

  frontend:
    build:
      context: ./frontend_dulce_colonial
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_WS_URL: http://localhost
    container_name: dulce_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  dulce_postgres_data:
  dulce_reports:
